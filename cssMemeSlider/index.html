<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>CSS Meme Slider</title>
</head>
<body>

  <div class="slider">
    <input type="radio" name="slide" id="s1" checked />
    <input type="radio" name="slide" id="s2" />
    <input type="radio" name="slide" id="s3" />
    <input type="radio" name="slide" id="s4" />

    <div class="slider-wrapper">
      <div class="slides">
        <div class="slide"><img src="https://static.tildacdn.com/tild6465-6132-4937-b964-336163313261/mem-2-1024x683.jpg" alt="Meme 1"></div>
        <div class="slide"><img src="https://n1s1.hsmedia.ru/67/70/54/6770546624e0573d370b00823cb56664/728x510_1_2b8e1e783854fd31829c6f0f47f294cf@1200x840_0xCcN05Pci_0400017394078438728.jpg.webp" alt="Meme 2"></div>
        <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6cq5XIdxaWaqZwyAR5LDCeAGF_Mr8gpXtqA&s" alt="Meme 3"></div>
        <div class="slide"><img src="https://static.eldorado.ru/promo/src/mem-ptitsa-vryad-li/img/img5.webp" alt="Meme 4"></div>
      </div>
    </div>

    <div class="slider-footer">
      <div class="captions-wrapper">
        <div class="captions">
          <p class="caption">think about it!!!</p>
          <p class="caption">unlikely</p>
          <p class="caption">I deny</p>
          <p class="caption">Fifty fifty</p>
        </div>
      </div>

      <div class="controls">
        <label for="s1" class="control-btn"></label>
        <label for="s2" class="control-btn"></label>
        <label for="s3" class="control-btn"></label>
        <label for="s4" class="control-btn"></label>
      </div>
    </div>
  </div>

</body>
</html>
